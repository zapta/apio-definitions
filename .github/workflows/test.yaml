name: test

on:
  # Run on each commit to this repo.
  push:

  # Run on pull requests.
  pull_request:
    branches:
      - main

  # Daily at 10AM UTC
  schedule:
    - cron: "0 10 * * *"

  # Allow manual triggers.
  workflow_dispatch:

defaults:
  run:
    shell: bash -x {0}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    env:
      # Windows python writes cp1252 to pipes and the scripts print
      # non-ASCII characters.
      PYTHONUTF8: "1"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Install python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Show python version
        run: |
          python --version

      # The tasks in tasks.py install their own python dependencies.
      - name: Install invoke
        run: |
          pip install invoke==2.2.1
          invoke --list

      - name: Install latest apio dev
        run: |
          pip install --force-reinstall -U git+https://github.com/fpgawars/apio.git
          apio packages install
          apio info system

      - name: Get apio 'definitions' package dir
        run: |
          apio api get-system --output ./_apio_api_system.json
          cat -n ./_apio_api_system.json
          apio_packages_dir=$(jq -r '.system["apio-packages-dir"]' ./_apio_api_system.json)
          echo "APIO_PACKAGES_DIR=$apio_packages_dir" >> $GITHUB_ENV
          apio_definitions_dir="${apio_packages_dir}/definitions"
          echo "APIO_DEFINITIONS_DIR=${apio_definitions_dir}" >> $GITHUB_ENV

      # Overwrite the definitions in the installed apio package with the ones
      # from this repo.
      - name: Patch apio definitions
        run: |
          ls -al $APIO_DEFINITIONS_DIR
          cp -rf ./definitions/* $APIO_DEFINITIONS_DIR
          ls -al $APIO_PACKAGES_DIR

      # Copy the common examples files to the examples.
      - name: Apply common example files
        run: |
          invoke copy-common

      # Overwrite the examples in the installed apio package with the ones
      # from this repo.
      - name: Patch apio with new definitions
        run: |
          ls -al $APIO_DEFINITIONS_DIR
          cp -rf ./definitions/* $APIO_DEFINITIONS_DIR
          ls -al $APIO_PACKAGES_DIR

      - name: Patch apio with new examples
        run: |
          ls -al $APIO_DEFINITIONS_DIR
          rm -rf $APIO_DEFINITIONS_DIR/examples
          ls -al $APIO_DEFINITIONS_DIR
          cp -r ./examples $APIO_DEFINITIONS_DIR
          ls -al $APIO_DEFINITIONS_DIR

      - name: Show the patched boards definitions
        run: |
          apio api get-boards

      - name: Show the patched fpgas definitions
        run: |
          apio api get-fpgas

      - name: Show the patched programmers definitions
        run: |
          apio api get-programmers

      - name: Show the patched examples
        run: |
          apio api get-examples

      - name: Fetch an apio example
        run: |
          mkdir test-project
          cd test-project
          apio examples fetch alhambra-ii/blinky

      - name: Build the test apio example
        run: |
          cd test-project
          apio build

      # -- We want to make sure we test the patched ones in the apio package
      # -- and not the ones the repo.
      - name: Delete local examples
        run: |
          ls -al
          rm -rf examples
          ls -al

      - name: Test the patched examples
        run: |
          invoke test --examples-root $APIO_DEFINITIONS_DIR/examples
